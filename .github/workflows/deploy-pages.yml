name: Deploy to GitHub Pages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.tag.outputs.is_stable }}
    steps:
      - name: Check out release tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag and deployment eligibility
        id: tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          stable_pattern='^v[0-9]+\.[0-9]+\.[0-9]+\+[0-9]{8}$'
          development_pattern='^v[0-9]+\.[0-9]+\.[0-9]+-dev[1-9][0-9]*\+[0-9]{8}$'
          test_pattern='^v[0-9]+\.[0-9]+\.[0-9]+-test\+[0-9]{8}$'

          if [[ "${tag}" =~ ${stable_pattern} ]]; then
            latest_stable_tag="$(git tag --list 'v*' --sort=-version:refname | while read -r candidate; do
              if [[ "${candidate}" =~ ${stable_pattern} ]]; then
                echo "${candidate}"
                break
              fi
            done)"

            if [[ "${tag}" != "${latest_stable_tag}" ]]; then
              echo "${tag} is not the latest stable tag (${latest_stable_tag}). Refusing to replace the deployed site."
              exit 1
            fi

            echo "is_stable=true" >> "${GITHUB_OUTPUT}"
            echo "Validated stable release tag: ${tag}"
          elif [[ "${tag}" =~ ${development_pattern} ]]; then
            echo "is_stable=false" >> "${GITHUB_OUTPUT}"
            echo "Validated development tag: ${tag}"
          elif [[ "${tag}" =~ ${test_pattern} ]]; then
            echo "is_stable=false" >> "${GITHUB_OUTPUT}"
            echo "Validated test tag: ${tag}"
          else
            echo "Invalid tag: ${tag}"
            echo "Use v<major>.<minor>.<patch>+YYYYMMDD, v<major>.<minor>.<patch>-dev<number>+YYYYMMDD, or v<major>.<minor>.<patch>-test+YYYYMMDD."
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    needs: validate-release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build static site
        run: npm run build
      - name: Configure GitHub Pages
        if: needs.validate-release.outputs.is_stable == 'true'
        uses: actions/configure-pages@v5
      - name: Upload static site
        if: needs.validate-release.outputs.is_stable == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [validate-release, verify]
    if: needs.validate-release.outputs.is_stable == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
